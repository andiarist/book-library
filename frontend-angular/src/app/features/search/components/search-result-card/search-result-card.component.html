<div class="flex h-full flex-col gap-3 justify-between rounded-lg bg-amber-50 p-6">
  <div class="flex h-full flex-col gap-2">
    @if (book().imageUrl) {
      <img
        [src]="book().imageUrl"
        [alt]="book().title"
        class="mx-auto h-auto w-full max-w-37.5 rounded-sm object-cover shadow-[0_2px_8px_rgba(0,0,0,0.3)]"
      />
    }
    <!-- <div class="flex flex-col gap-2"> -->
    <p class="text-lg">{{ book().title }}</p>

    @if (book().authors.length > 0) {
      <book-info-item [label]="'Autor(es)'" [value]="book().authors.join(', ')" />
    }
    <book-info-item [label]="'ISBN'" [value]="book().isbn" />
    <book-info-item [label]="'Editorial'" [value]="book().publisher" />
    <book-info-item [label]="'Páginas'" [value]="book().pageCount" />
  </div>
  <div class="flex justify-center">
    <app-button (click)="this.selectBook.emit(this.book())">Añadir a mi biblioteca</app-button>
  </div>

  <!-- </div> -->
</div>
