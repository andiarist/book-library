<div class="rounded-lg border border-gray-100 bg-white p-4 shadow-sm">
  Search page
  <section class="mb-6 border-gray-200 bg-gray-50 p-4 flex justify-between gap-4">
    <div class="flex flex-col gap-2 w-full">
      <label for="searchText" class="">Search text:</label>
      <input
        id="searchText"
        type="text"
        [formControl]="searchText"
        class="bg-amber-200 px-2 py-1 rounded w-full"
      />
    </div>
    <button
      (click)="onSubmit()"
      class="rounded flex items-center justify-center gap-1 bg-blue-400 px-4 font-semibold text-white"
    >
      <i class="fa-solid fa-magnifying-glass"></i>Buscar
    </button>
  </section>
  <section class="mt-8">
    <p>Resultados:</p>
    @if (searchLoading()) {
      <p>Cargando resultados</p>
      <i class="fa-solid fa-spinner" style="color: rgb(99, 230, 190)"></i>
    } @else {
      <div class="grid grid-cols-[repeat(auto-fill,minmax(300px,1fr))] gap-6">
        @for (book of searchResults(); track $index) {
          <search-result-card [book]="book" />
        }
      </div>
    }
  </section>
</div>
